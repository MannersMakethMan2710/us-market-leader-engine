name: Daily US Market Leader Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * 1-5"

permissions:
  contents: write

concurrency:
  group: daily-leader-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Download verified scan engine
        run: |
          curl -fsSL "https://us-market-leader-board-kh.kihyung-lee2710.chatgpt.site/engine/scanner-engine.tar.gz" -o scanner-engine.tar.gz
          echo "7698caafcb7e92ffeea377de4a280d301d99bcb2f26d31ee8e754692a7fbdabc  scanner-engine.tar.gz" | sha256sum -c -
          tar -xzf scanner-engine.tar.gz
      - name: Scan NYSE and Nasdaq
  run: node scanner/run.mjs --provider=free --output=data/scanner-data.json --concurrency=3
        run: node scanner/run.mjs --output=data/scanner-data.json --concurrency=4
      - name: Publish latest results
        run: |
          git config user.name "leader-scan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/scanner-data.json
          if git diff --cached --quiet; then
            echo "No data change"
          else
            git commit -m "Update leader scan data"
            git push
          fi
